/* Shop identity + dedicated settings navigation */
.shop-brand{display:flex;align-items:center;gap:10px;min-width:0}
.shop-icon{width:38px;height:38px;flex:0 0 38px;display:grid;place-items:center;border:1.5px solid rgba(255,255,255,.65);border-radius:12px;font-size:22px;animation:shopIconFloat 3s ease-in-out infinite}
.shop-title{display:block;max-width:60vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;animation:shopNameGlow 3.2s ease-in-out infinite}

nav button{line-height:1.2}
.nav-ico{display:block;font-size:17px;margin-bottom:3px}
.settings-section{margin-bottom:14px}
.settings-section h3{font:800 18px var(--h);margin:0 0 9px}
.settings-link{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:11px 2px;border-bottom:1px solid var(--line);color:var(--tx);font-weight:600;cursor:pointer}
.settings-link:last-child{border-bottom:0}
.settings-link span:last-child{color:var(--mut);font-size:19px}

/* ===== AE40 MOBILE RESPONSIVE LAYER ===== */
html {
  -webkit-text-size-adjust: 100%;
  text-size-adjust: 100%;
}
body {
  min-width: 320px;
  overflow-x: hidden;
  padding-bottom: calc(76px + env(safe-area-inset-bottom));
}
button, input, select, a {
  touch-action: manipulation;
}
button, .b, nav button {
  min-height: 44px;
}
input, select {
  min-height: 46px;
  font-size: 16px;
}
header {
  padding: 10px 14px;
  gap: 10px;
}
header b {
  min-width: 0;
  overflow-wrap: anywhere;
}
header small {
  white-space: nowrap;
  padding: 8px 2px 8px 8px;
}
main {
  width: 100%;
  padding: 12px;
}
.card, .t {
  min-width: 0;
  overflow-wrap: anywhere;
}
.row {
  min-width: 0;
  flex-wrap: wrap;
}
.row > * {
  min-width: 0;
}
.g {
  grid-template-columns: repeat(2, minmax(0, 1fr));
}
nav {
  grid-template-columns: repeat(5, minmax(0, 1fr));
  padding-bottom: env(safe-area-inset-bottom);
  min-height: 60px;
  width: 100%;
}
nav button {
  min-width: 0;
  width: 100%;
  margin: 0;
  padding: 10px 2px;
  font-size: 13px;
  overflow-wrap: anywhere;
}
#m .mc {
  padding: 16px;
  padding-bottom: calc(18px + env(safe-area-inset-bottom));
}
#m .mc .r {
  position: sticky;
  bottom: -16px;
  background: var(--card);
  padding: 10px 0 2px;
}
table.l {
  min-width: 440px;
}
.card:has(table.l) {
  overflow-x: auto;
  -webkit-overflow-scrolling: touch;
}
@media (max-width: 420px) {
  main {
    padding: 10px;
  }
  h2 {
    font-size: 22px;
  }
  .hero {
    padding: 15px;
  }
  .hero div {
    font-size: clamp(34px, 11vw, 46px);
  }
  .g {
    gap: 8px;
  }
  .t {
    padding: 11px;
  }
  .t b {
    font-size: 21px;
  }
  .b {
    padding: 11px 12px;
    font-size: 15px;
  }
  .b.s {
    padding: 8px 10px;
    font-size: 13px;
  }
  .row {
    gap: 7px;
  }
  nav button {
    font-size: 12px;
  }
  .lg {
    margin: 8vh auto;
    padding: 12px;
  }
}
@media (max-width: 350px) {
  nav button {
    font-size: 11px;
    padding-left: 1px;
    padding-right: 1px;
  }
  .g {
    grid-template-columns: 1fr 1fr;
  }
}

async function stockCorrect(){
 if(!own())return toast('Stock correction sirf Owner kar sakta hai.');
 if(!ST.P.length)return toast('Pehle product add karein.');
 const v=await ask('Stock Correction',[['p','Product','sel',ST.P.map(p=>[p.id,p.name+' (maujooda: '+stock(p.id)+' '+p.unit+')'])],['q','Stock mein tabdeeli (+ add / - kam)','number'],['r','Wajah / Note','text']]);
 if(!v)return;
 const delta=v[1],reason=(v[2]||'').trim();
 if(!Number.isFinite(delta)||delta===0)return toast('Qty zero na ho. Misal: +5 ya -2.');
 if(!reason)return toast('Correction ki wajah likhna zaroori hai.');
 const {data:{user},error:userErr}=await sb.auth.getUser();
 if(userErr||!user?.id)return toast('Login user verify nahi hua. Correction nahi ki.');
 const fresh=await sb.from('product_stock').select('stock').eq('product_id',v[0]).maybeSingle();
 if(fresh.error||!fresh.data)return toast('Current stock verify nahi hua. Correction nahi ki.');
 const current=Number(fresh.data.stock)||0;
 if(delta<0&&Math.abs(delta)>current)return toast('Itna stock kam nahi kar sakte. Maujooda stock: '+current);
 if(!ST.me?.shop_id)return toast('Shop ID verify nahi hui. Correction nahi ki.');
 if(!confirm('Maujooda stock '+current+' hai. '+(delta>0?'+':'')+delta+' adjust karna hai? Wajah: '+reason))return;
 const r=await sb.from('stock_adjustments').insert({shop_id:ST.me.shop_id,product_id:v[0],qty:delta,reason,created_by:user.id});
 if(bad(r))return;
 lg('Stock correction '+gp(v[0]).name+' '+(delta>0?'+':'')+delta+' | '+reason);
 await load();draw();toast('Stock correction save ho gayi.');
}

async function loadTrash(){
 const tables=['products','customers','suppliers'];
 const rs=await Promise.all(tables.map(t=>sb.from(t).select('id,name,deleted_at').not('deleted_at','is',null).order('deleted_at',{ascending:false})));

async function moveTrash(table,id){
 if(!own())return toast('Sirf Owner ye kar sakta hai.');
 const {data:{user},error:userErr}=await sb.auth.getUser();
 if(userErr||!user?.id)return toast('Login user verify nahi ho saka. Trash action nahi kiya.');
 if(table==='customers'){const b=await sb.from('customer_balance').select('balance').eq('customer_id',id).maybeSingle();if(b.error)return toast('Balance check nahi ho saka. Delete nahi kiya.');if(+b.data?.balance>0)return toast('Is customer ka '+R(b.data.balance)+' udhaar baqi hai. Pehle payment receive karein.');}
 if(table==='suppliers'){const b=await sb.from('supplier_balance').select('balance').eq('supplier_id',id).maybeSingle();if(b.error)return toast('Supplier balance check nahi ho saka. Delete nahi kiya.');if(+b.data?.balance>0)return toast('Is supplier ka '+R(b.data.balance)+' dena baqi hai. Pehle hisaab clear karein.');}
 if(!confirm('Is record ko Trash mein bhejna hai?'))return;
 const r=await sb.from(table).update({deleted_at:new Date().toISOString(),deleted_by:user.id}).eq('id',id);
 if(bad(r))return;toast('Record Trash mein chala gaya.');
 if(table==='suppliers')await loadSup();else await load();draw();
}
async function restoreTrash(table,id){
 if(!own())return toast('Sirf Owner restore kar sakta hai.');

 if(bad(r))return;toast('Record restore ho gaya.');await loadTrash();if(table==='suppliers')await loadSup();else await load();draw();
}
async function permanentTrash(table,id){
 if(!own())return toast('Sirf Owner ye kar sakta hai.');

async function loadGoogleStatus(){
 const el=$('googleStatus');if(el)el.textContent='Connection status check ho raha hai...';
 try{
  const {data:{session},error}=await sb.auth.getSession();
  if(error||!session?.access_token){if(el)el.textContent='Login session nahi mili. Dobara login karein.';return}
  const r=await fetch(SUPABASE_URL+'/functions/v1/ae40-google-backup',{
   method:'POST',
   headers:{'Content-Type':'application/json','Authorization':'Bearer '+session.access_token,'apikey':SUPABASE_KEY},
   body:JSON.stringify({action:'status'})
  });
  const data=await r.json().catch(()=>({}));
  if(!r.ok||data.error){if(el)el.textContent='Status check nahi ho saka: '+(data.error||'Server error');return}
  if(el)el.textContent=data.connected?'Connected ✓  |  '+(data.email||'Google email unavailable'):'Not connected';
 }catch(e){if(el)el.textContent='Status check nahi ho saka. Internet check karein.'}
}
async function backupGoogleSheets(){
 const popup=window.open('about:blank','_blank');
 const {data:{session},error}=await sb.auth.getSession();
 if(error||!session?.access_token){if(popup)popup.close();return toast('Pehle dobara login karein.')}
 toast('Google Sheets backup ban raha hai...');
 try{
  const r=await fetch(SUPABASE_URL+'/functions/v1/ae40-google-backup',{
   method:'POST',
   headers:{'Content-Type':'application/json','Authorization':'Bearer '+session.access_token,'apikey':SUPABASE_KEY},
   body:JSON.stringify({action:'backup'})
  });
  const data=await r.json().catch(()=>({}));
  if(!r.ok||!data.success){if(popup)popup.close();return toast(data.error||'Google backup nahi ban saka.')}
  if(popup&&data.spreadsheet_url)popup.location.href=data.spreadsheet_url;
  toast('Google Sheets backup create ho gaya.');
 }catch(e){if(popup)popup.close();toast('Backup request fail hui. Internet check karein.')}
}
async function connectGoogle(){
 const {data:{session},error}=await sb.auth.getSession();
 if(error||!session?.access_token)return toast('Pehle dobara login karein.');
 const popup=window.open('about:blank','_blank');
 try{
  const r=await fetch(SUPABASE_URL+'/functions/v1/ae40-google-backup',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+session.access_token,'apikey':SUPABASE_KEY},body:'{}'});
  const data=await r.json().catch(()=>({}));
  if(!r.ok||!data.url){if(popup)popup.close();return toast(data.error||'Google connection shuru nahi ho saki.')}
  if(popup)popup.location.href=data.url;else window.location.href=data.url;
 }catch(e){if(popup)popup.close();toast('Connection error. Internet check karein.')}
}

function ae40TranslateText(input){
 let lang=getLang(); if(lang==='roman')return input;
 const dict=AE40_I18N[lang]||{};
 let out=input;
 Object.keys(dict).sort((a,b)=>b.length-a.length).forEach(k=>{out=out.split(k).join(dict[k])});
 return out;
}
function applyTranslations(root){
 if(!root||getLang()==='roman')return;
 const walker=document.createTreeWalker(root,NodeFilter.SHOW_TEXT);let n;
 while(n=walker.nextNode()){if(n.nodeValue.trim())n.nodeValue=ae40TranslateText(n.nodeValue)}
 root.querySelectorAll('input[placeholder],textarea[placeholder],button[title],button[aria-label]').forEach(el=>{['placeholder','title','aria-label'].forEach(a=>{if(el.hasAttribute(a))el.setAttribute(a,ae40TranslateText(el.getAttribute(a)))})});
}
